id = "drip.beads"
name = "Beads"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Feed the sidebar's beads rail: the focused repo's bd board, worst status first"
platforms = ["linux", "macos"]

# A re-implementation of herdr-beads (https://github.com/miiraheart/herdr-beads,
# MIT), which put a `bd` board in a herdr pane. This is the sidebar's share of
# that idea: not the board, but the one line of it you want on screen while you
# work, and a click to open the rest. The status vocabulary and glyphs are that
# project's -- see nix/sidebar-beads.rs for the full credit note.

[[startup]]
command = ["bin/watch"]

[[actions]]
id = "sync"
title = "Refresh the beads rail now"
contexts = ["workspace"]
command = ["bin/sync"]

[[actions]]
id = "watch"
title = "Start the beads watcher"
contexts = ["workspace"]
command = ["bin/watch"]

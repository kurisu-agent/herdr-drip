id = "drip.beads"
name = "Beads"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "The focused repo's bd board: a rail in the sidebar, a board in a pane"
platforms = ["linux", "macos"]

# Both halves of this plugin come from herdr-beads
# (https://github.com/miiraheart/herdr-beads, MIT), by different routes.
#
# The RAIL (bin/watch + nix/sidebar-beads.rs) is a re-implementation for a
# surface that project has no equivalent of: not the board, but the one line of
# it you want on screen while you work, and a click to open the rest. Its
# status vocabulary and glyphs are herdr-beads'.
#
# The BOARD (board/) is herdr-beads itself, forked into this repo -- see
# board/UPSTREAM.md for the rev and board/LICENSE for the terms it travels
# under. Forked rather than depended on because the fixes it needs here are
# changes to its behaviour, and a vendored input is a thing you cannot edit.

[[startup]]
command = ["bin/watch"]

# ---------------------------------------------------------------------------
# The board, as three ways of opening one binary.
#
# `./board/target/release/herdr-beads` is where nix/beads-board.nix's build is
# spliced in (nix/drip-plugins.nix), standing in for the `[[build]]` this
# manifest deliberately does not declare -- `herdr plugin link` never runs one
# and a store path has no toolchain to run it with. On a LINKED WORKING TREE
# there is no splice, so `cargo build --release` in board/ once, by hand: the
# path is cargo's own output path so that both roads end in the same place.
#
# The leading `./` is load-bearing: herdr hands a pane command to portable_pty's
# CommandBuilder, which only treats it as a path when it contains a `/` and
# otherwise looks it up on PATH.
#
# `placement` here is only a DEFAULT -- the open request's --placement wins
# (`params.placement.unwrap_or(pane.placement)`), so any of these can be opened
# any way. What each entrypoint really fixes is its `--mode`, which is the
# board's own idea of how much room it has: Dock starts in List with no detail
# pane, Popup starts in Kanban with one. Note that `--mode` understands `dock`
# and nothing else -- every other value, `tab` included, means popup -- which is
# why the tab entrypoint below asks for `popup` and is not a typo.
#
# The titles carry a Codicon because herdr makes the manifest title the pane's
# label (`set_manual_label`), so it is what the tab bar and the sidebar show.
# Same font plane as the rename presets (nix/rename-presets.rs), same reason:
# one cell wide, and the word is right there if the font has no glyph.
#
# LOWERCASE, all three, because the word is `bd`'s and not a product's: it is
# what the sidebar rail calls itself (`▾ beads`), what the command is, and a
# tab reading `Beads` beside a rail reading `beads` is two names for one thing.
# The plugin's `name` above stays sentence case -- that field is the registry's
# and reads in a list beside "Agent scope" and "Gumbo usage", where a lone
# lowercase entry would look like a typo rather than a decision.

[[panes]]
id = "dock"
title = "\ueab3 beads"  # cod-checklist
description = "The board as a narrow column: list view, no detail pane"
placement = "split"
command = ["./board/target/release/herdr-beads", "--mode", "dock"]

[[panes]]
id = "tab"
title = "\ueb30 beads"  # cod-project
description = "The board as a whole tab: kanban, with the detail pane open"
placement = "tab"
command = ["./board/target/release/herdr-beads", "--mode", "popup"]

# The floating board. Declared but bound to no key: a popup has no pane id in
# `pane list`, so nothing can find it again to toggle it closed -- and a
# keybinding that only ever opens is a keybinding that stacks up popups.
# `herdr plugin pane open --plugin drip.beads --entrypoint popup` still works,
# and Esc closes it. width/height are accepted ONLY here; on any other
# placement they fail the manifest load outright.
[[panes]]
id = "popup"
title = "\ueb30 beads"  # cod-project
description = "The board as a floating popup over whatever you were doing"
placement = "popup"
width = "85%"
height = "85%"
command = ["./board/target/release/herdr-beads", "--mode", "popup"]

[[actions]]
id = "open-dock"
title = "Beads: dock the board on the left"
contexts = ["workspace", "tab", "pane"]
command = ["bin/open-dock"]

[[actions]]
id = "open-tab"
title = "Beads: open the board in a tab"
contexts = ["workspace", "tab", "pane"]
command = ["bin/open-tab"]

[[actions]]
id = "sync"
title = "Refresh the beads rail now"
contexts = ["workspace"]
command = ["bin/sync"]

[[actions]]
id = "watch"
title = "Start the beads watcher"
contexts = ["workspace"]
command = ["bin/watch"]

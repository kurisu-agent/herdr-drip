[package]
name = "herdr-beads"
version = "0.1.0"
edition = "2021"
description = "A beads (bd) board for herdr: kanban + list + table over your bd issues, docked or floating."
license = "MIT"
repository = "https://github.com/miiraheart/herdr-beads"

[[bin]]
name = "herdr-beads"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
tui-markdown = { version = "=0.3.6", features = ["highlight-code"] }
# Only to repair tui-markdown's handling of indented code blocks before it sees
# them (see src/markdown.rs). Same major as tui-markdown's own dependency, so
# this adds a name to the manifest and nothing to the binary.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"

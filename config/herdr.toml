onboarding = false
[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
# Needs herdr >= 0.8.0; older servers ignore unknown keys with a warning.
tab_bar_position = "bottom"
# One tab is not a choice, so the bar showing it is a wasted line — hide it
# until there are two. The row comes back the moment a second tab exists.
hide_tab_bar_when_single_tab = true

agent_panel_sort = "priority"

# The older spelling of theme.custom.accent below. herdr reads this one ONLY
# when theme.custom.accent is unset, so the two cannot disagree in effect;
# it is kept in step so that either key answers the same.
accent = "#B4BEFE"

[theme]
name = "catppuccin"
# Left off deliberately, and not just out of caution: the tokens below are
# Mocha values, and they are applied on top of whichever base theme is
# selected. Following the terminal into light mode would therefore paint our
# dark chrome onto catppuccin-latte rather than switch flavours. A host that
# wants the light half sets a Latte palette through the module's
# `theme.palette` (nix-env's palette takes `variant = "latte"`).
auto_switch = false

# The drip's colour scheme, one token per line, matching the zellij theme so
# the two multiplexers stack without a seam.
#
# GENERATED VALUES, HAND-PLACED FILE. nix/theme.nix is the generator and the
# palette is what it reads; this block is that generator's output for the
# default palette. On the nix path the module regenerates it and outranks
# what is written here, so a host passing its own palette is never quietly
# overruled by this file. It is spelled out anyway because apply-config.sh
# links this file verbatim — the non-nix dev loop needs a theme too. Change
# colours in the palette, not here, and re-render both together.
#
# FOUR VALUES BELOW ARE CURRENTLY HAND-SET AND DIVERGE FROM THE GENERATOR
# (marked `hand-set`). nix/theme.nix still emits the palette's answer for each,
# and on the nix path it wins at priority 900 — so a fleet host renders the OLD
# scheme and only a host running apply-config.sh sees what is written here.
# That split is deliberate but temporary: two of them cannot be expressed as a
# palette colour at all (`reset` is transparency, not a hue), so closing it
# needs an option on the module rather than a new hex. Until then, treat this
# block as ahead of the generator, not as its render.
[theme.custom]
accent = "#B4BEFE"      # hand-set: lavender. Palette accent is green (-> #A6E3A1).
panel_bg = "reset"      # hand-set: the terminal's own bg, so the chrome is transparent.
sidebar_bg = "reset"    # hand-set: same, for the sidebar plane.
surface_dim = "#1E1E2E" # separators (bg -> base)
surface0 = "#181825"    # hand-set: mantle. Unselected tab bg (and every selected row).
surface1 = "#45475A"    # hover / active
overlay0 = "#6C7086"    # muted text: numbers, secondary info
overlay1 = "#7F849C"    # brighter muted text
subtext0 = "#A6ADC8"    # subdued labels (secondary)
text = "#CDD6F4"        # main foreground (primary)
mauve = "#CBA6F7"       # branch names, special labels
green = "#A6E3A1"       # done / idle
yellow = "#F9E2AF"      # working / running
red = "#F38BA8"         # needs attention / blocked
peach = "#FAB387"       # interrupted / warning
blue = "#89B4FA"        # unseen / done notifications
teal = "#94E2D5"        # notification accent, unseen markers

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["$worktree"]]

[terminal]
# New panes boot straight into a yolo claude; exit drops to zsh. The name is
# resolved against the herdr SERVER's PATH (no ~ expansion), so it must live
# somewhere the server sees: on NixOS the drip's module puts it on the SYSTEM
# path, and apply-config.sh links it into ~/.local/bin for shells that launch
# herdr with a normal user PATH.
#
# Deliberately NOT `nix profile add .#yolo-shell` any more. ~/.nix-profile/bin
# comes BEFORE /run/current-system/sw/bin on the server's PATH, so a profile
# copy shadows the module's and stays frozen at its install rev through every
# rebuild — which is how triforce-dev spent 2026-08-12 launching an unrouted
# claude in every pane. See the warning in README.md.
default_shell = "yolo-shell"

[keys]
# Layering: Ctrl+p <letter> = outer zellij, Ctrl+b <letter> = herdr.
split_vertical = "prefix+r"   # Ctrl+b r — pane to the right
split_horizontal = "prefix+d" # Ctrl+b d — pane below
resize_mode = ""              # frees prefix+r; resizing is done by mouse
copy_mode = ""                # frees prefix+[ for flip-split; select with the mouse
# close_pane stays on the default prefix+x (Ctrl+b x)

# Pane navigation: Alt+Shift+arrows. Left/right move panes only; up/down
# go through drip.smart-focus, which rolls into the previous/next space
# when pushing against the top/bottom edge.
focus_pane_left = "alt+shift+left"
focus_pane_right = "alt+shift+right"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "alt+shift+up"
command = "herdr plugin action invoke up --plugin drip.smart-focus"
description = "focus up / previous space"

[[keys.command]]
key = "alt+shift+down"
command = "herdr plugin action invoke down --plugin drip.smart-focus"
description = "focus down / next space"

# Ctrl+b [ — two columns become two rows and back. Takes over the key herdr
# gives copy mode by default, which is unbound above.
[[keys.command]]
key = "prefix+["
command = "herdr plugin action invoke flip --plugin drip.flip-split"
description = "flip split orientation"

# Ctrl+b a — the agent panel lists this space's agents (the default) or every
# space's. A free key in both herdr's defaults and this file, and the toggle
# needs one: an action's `contexts` are advisory in 0.8.0, so a plugin action
# reaches the palette and the keybindings but never herdr's own menus.
[[keys.command]]
key = "prefix+a"
command = "herdr plugin action invoke toggle --plugin drip.agent-scope"
description = "agents: this space / every space"

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = false

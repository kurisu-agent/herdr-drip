onboarding = false
[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[theme]
name = "catppuccin"
auto_switch = false

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["$worktree"]]

[keys]
# Layering: Ctrl+p <letter> = outer zellij, Ctrl+b <letter> = herdr.
split_vertical = "prefix+r"   # Ctrl+b r — pane to the right
split_horizontal = "prefix+d" # Ctrl+b d — pane below
resize_mode = ""              # frees prefix+r; resizing is done by mouse
# close_pane stays on the default prefix+x (Ctrl+b x)

# Pane navigation: Alt+Shift+arrows via drip.smart-focus — moves between
# panes, and rolls into the previous/next space at the workspace edge.
# The built-in focus bindings stay unset so the chords are free.
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "alt+shift+left"
command = "~/Code/herdr-drip/smart-focus/bin/focus left"
description = "focus left / previous space"

[[keys.command]]
key = "alt+shift+down"
command = "~/Code/herdr-drip/smart-focus/bin/focus down"
description = "focus down / next space"

[[keys.command]]
key = "alt+shift+up"
command = "~/Code/herdr-drip/smart-focus/bin/focus up"
description = "focus up / previous space"

[[keys.command]]
key = "alt+shift+right"
command = "~/Code/herdr-drip/smart-focus/bin/focus right"
description = "focus right / next space"

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = false
